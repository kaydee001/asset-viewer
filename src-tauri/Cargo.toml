[package]
name = "asset-viewer"
version = "2.0.1"
description = "A lightweight local 3D model viewer"
edition = "2021"

[features]
# the single-file portable exe: the HDRI maps are built into it (build.rs), not read from an hdri folder
portable = []

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
# devtools: lets --debug open the inspector in release builds too
tauri = { version = "2.12", features = ["devtools"] }
serde_json = "1"
percent-encoding = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
