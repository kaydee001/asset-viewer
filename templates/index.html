<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asset Viewer</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="dark">
    <div id="progress"></div>

    <div id="overlay" style="display: none;">
        <p>Drop to open</p>
    </div>

    <div id="commandbar" class="card">
        <button id="open-btn" class="tool" data-label="Open file">
            <svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
            <span>Open</span>
        </button>
        <button id="reset-btn" class="tool" data-label="Reset view">
            <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
            <span>Reset view</span>
        </button>
        <button id="screenshot-btn" class="tool" data-label="Save screenshot">
            <svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.5"/></svg>
            <span>Screenshot</span>
        </button>
        <span class="divider"></span>
        <button id="hide-btn" class="tool" data-label="Hide interface">
            <svg viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
            <span>Hide UI</span>
        </button>
        <input type="file" id="open-input" multiple style="display: none;">
    </div>

    <div id="left-panel" class="card">
        <div id="stats-panel"></div>
        <div class="panel-section" id="parts-section">
            <div class="section-title" id="parts-title"><span>Parts</span></div>
            <div id="parts-list"></div>
        </div>
    </div>

    <div id="right-panel" class="card">
        <div class="panel-section">
            <div class="section-title">View</div>
            <button id="auto-rotate-btn" class="row" role="switch"><span class="row-label">Auto rotate</span><kbd>R</kbd><span class="switch"><i></i></span></button>
            <button id="pan-btn" class="row" role="switch"><span class="row-label">Pan</span><kbd>P</kbd><span class="switch"><i></i></span></button>
            <button id="bottom-lock-btn" class="row active" role="switch"><span class="row-label">Lock below grid</span><span class="switch"><i></i></span></button>
            <button id="wireframe-btn" class="row" role="switch"><span class="row-label">Wireframe</span><kbd>W</kbd><span class="switch"><i></i></span></button>
            <button id="grid-btn" class="row active" role="switch"><span class="row-label">Grid</span><kbd>G</kbd><span class="switch"><i></i></span></button>
            <button id="theme-btn" class="row active" role="switch"><span class="row-label">Dark mode</span><kbd>T</kbd><span class="switch"><i></i></span></button>
        </div>

        <div class="panel-section">
            <div class="section-title">Shading</div>
            <select id="shading-select">
                <option value="shaded">Shaded</option>
                <option value="clay">Clay</option>
                <option value="normals">Normals</option>
                <option value="uv">UV checker</option>
            </select>
        </div>

        <div class="panel-section">
            <div class="section-title">Lighting</div>
            <select id="hdri-select">
                <option value="hdri_1.hdr">Studio small 08</option>
                <option value="hdri_2.hdr">Citrus orchid road</option>
                <option value="hdri_3.hdr">Meadow 02</option>
                <option value="hdri_4.hdr">Sunny rose garden</option>
                <option value="hdri_5.hdr">Kloofendal 48d</option>
            </select>
            <div id="hdri-name"></div>
            <button id="upload-hdri-btn" class="text-btn">Upload HDRI...</button>
            <input type="file" id="hdri-upload" accept=".hdr" style="display: none;">
        </div>

        <div class="panel-section" id="animation-section" style="display: none;">
            <div class="section-title">Animation</div>
            <select id="animation-select"></select>
            <button id="animation-btn" class="text-btn">Pause</button>
        </div>
    </div>

    <div id="hint" class="card">
        <strong>Drop a 3D model or folder here</strong>
        <span>glb &middot; gltf &middot; fbx &middot; obj</span>
    </div>

    <div id="toast" style="display: none;"></div>

    <script type="module" src="{{ url_for('static', filename='viewer.js') }}"></script>
</body>
</html>
