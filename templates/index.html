<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">  
    <title>Asset Viewer</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script type="importmap">
    {
        "imports": {
            "three": "{{ url_for('static', filename='vendor/three/build/three.module.js') }}",
            "three/addons/": "{{ url_for('static', filename='vendor/three/addons/') }}"
        }
    }
    </script>
</head>
<body class="light">
    <div id="drop-zone"></div>
    
    <div id="overlay" style="display: none;">
        <p>drag and drop a 3D file</p>
    </div>

    <div id="left-panel">
        <div id="stats-panel">drop a 3D file to begin</div>
        <div id="asset-list"></div>
    </div>

    <div id="toast" style="display: none;"></div>

    <div id="right-panel">
        <div class="panel-section">
            <button id="open-btn">open file</button>
            <input type="file" id="open-input" multiple style="display: none;">
        </div>

        <div class="panel-section">
            <div class="section-title">camera</div>
            <button id="auto-rotate-btn"> - auto rotate [off]</button>
            <button id="pan-btn"> - pan [off]</button>
            <button id="bottom-lock-btn"> - bottom lock [on]</button>
        </div>

        <div class="panel-section">
            <div class="section-title">viewport</div>        
            <button id="wireframe-btn"> - wireframe [off]</button>
            <button id="grid-btn"> - grid [on]</button>
            <button id="theme-btn"> - theme [light]</button>
            <button id="screenshot-btn"> - screenshot</button>
        </div>

        <div class="panel-section" id="animation-section" style="display: none;">
            <div class="section-title">animation</div>
            <select id="animation-select"></select>
            <button id="animation-btn"> - pause</button>
        </div>

        <div class="panel-section">
            <div class="section-title">lighting</div>
            <select id="hdri-select">
                <option value="hdri_1.hdr">studio small 08</option>
                <option value="hdri_2.hdr">citrus orchid road</option>
                <option value="hdri_3.hdr">meadow 02</option>
                <option value="hdri_4.hdr">sunny rose garden</option>
                <option value="hdri_5.hdr">kloofendal 48d</option>
            </select>
            <div id="hdri-name"></div>
            <button id="upload-hdri-btn">upload hdri</button>
            <input type="file" id="hdri-upload" accept=".hdr" style="display: none;">
        </div>

        <div class="panel-section">
            <button id="reset-btn">reset</button>
        </div>
    </div>    

    <script type="module" src="{{ url_for('static', filename='viewer.js') }}"></script>
</body>
</html>
