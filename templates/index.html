<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asset Viewer</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<!-- single page; all behaviour is in static/*.js, entry point is viewer.js -->
<body class="dark">
    <!-- loading bar along the top edge, animated by the body.busy class -->
    <div id="progress"></div>

    <!-- shown while a file is dragged over the window -->
    <div id="overlay" style="display: none;">
        <p>Drop to open</p>
    </div>

    <!-- top bar: open / reset / (screenshot, hidden for now) / shortcuts / hide ui / theme -->
    <div id="commandbar" class="card">
        <button id="open-btn" class="tool" data-label="Open file">
            <svg viewBox="0 0 24 24"><path d="m6 14 1.5-2.9A2 2 0 0 1 9.24 10H20a2 2 0 0 1 1.94 2.5l-1.54 6a2 2 0 0 1-1.95 1.5H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h3.9a2 2 0 0 1 1.69.9l.81 1.2a2 2 0 0 0 1.67.9H18a2 2 0 0 1 2 2v2"/></svg>
            <span>Open</span>
        </button>
        <button id="reset-btn" class="tool" data-label="Reset view">
            <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
            <span>Reset view</span>
        </button>
        <!-- screenshot ("photo mode") is hidden for now. the code in ui.js still works: remove the hidden attribute
             here and on #screenshot-section, and put the S shortcut back in shortcuts.js -->
        <button id="screenshot-btn" class="tool" data-label="Save screenshot" hidden>
            <svg viewBox="0 0 24 24"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>
            <span>Screenshot</span>
        </button>
        <span class="divider"></span>
        <button id="help-btn" class="tool" data-label="Keyboard shortcuts">
            <svg viewBox="0 0 24 24"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="M6 8h.01M10 8h.01M14 8h.01M18 8h.01M8 12h.01M12 12h.01M16 12h.01M7 16h10"/></svg>
            <span>Shortcuts</span>
        </button>
        <button id="hide-btn" class="tool" data-label="Hide interface">
            <svg viewBox="0 0 24 24"><path d="M10.73 5.08a10.74 10.74 0 0 1 11.2 6.57 1 1 0 0 1 0 .7 10.75 10.75 0 0 1-1.44 2.49"/><path d="M14.08 14.16a3 3 0 0 1-4.24-4.24"/><path d="M17.48 17.5a10.75 10.75 0 0 1-15.42-5.15 1 1 0 0 1 0-.7 10.75 10.75 0 0 1 4.45-5.14"/><path d="m2 2 20 20"/></svg>
            <span>Hide UI</span>
        </button>
        <span class="divider"></span>
        <!-- light / dark theme, .active = dark. the sun shows in dark mode (click for light), the moon in light mode -->
        <button id="theme-btn" class="tool icon-only active" role="switch" aria-checked="true" data-label="Light / dark theme">
            <svg class="ic-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
            <svg class="ic-moon" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
        </button>
        <input type="file" id="open-input" multiple style="display: none;">
    </div>

    <!-- frame rate, top right corner of the viewport, only while an animation plays (fps.js) -->
    <div id="fps" class="card" aria-hidden="true" hidden><span class="fps-value"></span><span class="fps-ms"></span></div>

    <!-- left dock: parts list (outliner.js) on top, model info (stats.js) under it; shown once a model is loaded -->
    <aside id="model-panel" class="card dock">
        <header class="dock-head"><h2>Model</h2></header>
        <div class="panel-section" id="parts-section">
            <div class="section-title" id="parts-title"><span>Parts</span><span id="parts-count" class="count"></span></div>
            <div id="parts-list"></div>
            <!-- materials of the part selected in the list (outliner.js) -->
            <div id="material-info"></div>
        </div>
        <div id="stats-panel"></div>
    </aside>

    <!-- right dock: scene settings. the .row buttons are on/off switches wired up in ui.js -->
    <aside id="scene-panel" class="card dock">
        <header class="dock-head"><h2>Scene</h2></header>

        <div class="panel-section">
            <div class="section-title">Camera</div>
            <button id="auto-rotate-btn" class="row" role="switch"><span class="row-label">Auto rotate</span><kbd>R</kbd><span class="switch"><i></i></span></button>
            <button id="ortho-btn" class="row" role="switch"><span class="row-label">Orthographic</span><kbd>P</kbd><span class="switch"><i></i></span></button>
            <button id="bottom-lock-btn" class="row active" role="switch"><span class="row-label">Lock below grid</span><span class="switch"><i></i></span></button>
            <!-- only shown for gltf files that contain cameras (ui.js) -->
            <div id="camera-section" style="display: none;">
                <select id="camera-select" aria-label="Camera"></select>
            </div>
        </div>

        <div class="panel-section">
            <div class="section-title">Overlays</div>
            <button id="grid-btn" class="row active" role="switch"><span class="row-label">Grid</span><kbd>G</kbd><span class="switch"><i></i></span></button>
            <button id="axes-btn" class="row" role="switch"><span class="row-label">Axes</span><kbd>X</kbd><span class="switch"><i></i></span></button>
            <button id="bbox-btn" class="row" role="switch"><span class="row-label">Bounding box</span><kbd>B</kbd><span class="switch"><i></i></span></button>
        </div>

        <div class="panel-section">
            <div class="section-title">Shading</div>
            <select id="shading-select" aria-label="Shading mode">
                <option value="shaded">Shaded</option>
                <option value="clay">Clay</option>
                <option value="normals">Normals</option>
                <option value="uv">UV checker</option>
                <option value="vertexcolors">Vertex colors</option>
            </select>
            <button id="wireframe-btn" class="row" role="switch"><span class="row-label">Wireframe</span><kbd>W</kbd><span class="switch"><i></i></span></button>
        </div>

        <div class="panel-section">
            <div class="section-title">Lighting</div>
            <select id="hdri-select" aria-label="Lighting environment">
                <!-- values are file names in the hdri/ folder (Poly Haven, CC0, 2k); the first one is the default -->
                <option value="studio_small_09_2k.hdr">Studio, soft boxes</option>
                <option value="brown_photostudio_02_2k.hdr">Photo studio</option>
                <option value="photo_studio_loft_hall_2k.hdr">Loft, window light</option>
                <option value="empty_warehouse_01_2k.hdr">Warehouse</option>
                <option value="kloofendal_overcast_puresky_2k.hdr">Overcast sky</option>
                <option value="venice_sunset_2k.hdr">Sunset</option>
            </select>
            <div id="hdri-name"></div>
            <button id="upload-hdri-btn" class="text-btn">Open HDRI file</button>
            <input type="file" id="hdri-upload" accept=".hdr" style="display: none;">
            <!-- turns the hdri and the key light together (scene.js) -->
            <label class="slider-row"><span>Light angle</span><input type="range" id="sun-range" min="0" max="360" value="0"></label>
            <label class="slider-row"><span>Exposure</span><input type="range" id="exposure-range" min="0.1" max="2" step="0.05" value="0.7"></label>
        </div>

        <div class="panel-section" id="screenshot-section" hidden>
            <div class="section-title">Screenshot</div>
            <select id="shot-scale" aria-label="Screenshot size">
                <option value="1">Window size</option>
                <option value="2">2x resolution</option>
                <option value="4">4x resolution</option>
            </select>
            <button id="shot-bg-btn" class="row" role="switch"><span class="row-label">Include background</span><span class="switch"><i></i></span></button>
        </div>
    </aside>

    <!-- transport bar: always visible, enabled by animation.js when the model has animation clips -->
    <div id="transport" class="card">
        <button id="animation-btn" class="icon-btn play" data-label="Play / pause" aria-label="Play / pause">
            <svg class="ic-play" viewBox="0 0 24 24"><path d="M8 5.5v13l11-6.5z"/></svg>
            <svg class="ic-pause" viewBox="0 0 24 24"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>
        </button>
        <span id="animation-current" class="time">0:00</span>
        <input type="range" id="animation-time" min="0" max="1" step="0.001" value="0" aria-label="Seek">
        <span id="animation-duration" class="time">0:00</span>
        <select id="animation-select" aria-label="Animation clip"></select>
        <select id="animation-speed" aria-label="Playback speed">
            <option value="0.25">0.25x</option>
            <option value="0.5">0.5x</option>
            <option value="1" selected>1x</option>
            <option value="2">2x</option>
        </select>
        <button id="animation-loop-btn" class="icon-btn active" role="switch" aria-checked="true" aria-label="Loop" data-label="Loop">
            <svg viewBox="0 0 24 24"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></svg>
        </button>
    </div>

    <!-- empty state, hidden once a model is loaded (body.has-model) -->
    <div id="hint" class="card">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg>
        <strong>Drop a model or a folder to open it</strong>
        <span>glb &middot; gltf &middot; fbx &middot; obj &middot; stl &middot; ply &middot; 3mf</span>
    </div>

    <div id="toast" role="status" aria-live="polite" style="display: none;"></div>

    <!-- keyboard shortcut list, rows are generated from the shortcut map in shortcuts.js -->
    <div id="help" style="display: none;">
        <div id="help-card" class="card" role="dialog" aria-modal="true" aria-label="Keyboard shortcuts">
            <div class="help-title">Keyboard shortcuts</div>
            <div id="help-list"></div>
            <div class="help-foot">Press <kbd>Esc</kbd> to close</div>
        </div>
    </div>

    <script type="module" src="{{ url_for('static', filename='viewer.js') }}"></script>
</body>
</html>
